[workspace]
resolver = "2"
members = ["src-tauri"]
exclude = ["vendor/portable-pty"]

[workspace.package]
version = "0.15.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[profile.release]
# Symbols are not read back from the shipped binary: panics print their
# message without a backtrace unless RUST_BACKTRACE is set, which no release
# path does. Stripping them took the macOS binary from 32.4 MB to 23.0 MB.
strip = true
